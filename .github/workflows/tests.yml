name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      GRADIO_ANALYTICS_ENABLED: "False"
      HF_HUB_DISABLE_TELEMETRY: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          # Trial contracts archive the pinned application commit.
          fetch-depth: 0
      - name: Install audio build dependencies
        run: sudo apt-get update && sudo apt-get install -y portaudio19-dev libsndfile1 ffmpeg
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.10.7"
          enable-cache: true
      - name: Install locked Python environment
        run: uv sync --frozen --python 3.12
      - name: Prepare wheels for offline packaged CLI tests
        run: |
          export CHATTERPAL_TEST_WHEELHOUSE="$RUNNER_TEMP/packaged-cli-wheelhouse"
          printf 'CHATTERPAL_TEST_WHEELHOUSE=%s\n' "$CHATTERPAL_TEST_WHEELHOUSE" >> "$GITHUB_ENV"
          uv export --frozen --no-dev --no-emit-project --quiet --output-file "$RUNNER_TEMP/packaged-cli-requirements.txt"
          uv run --no-project --python 3.12 --with pip python -m pip download --only-binary=:all: --no-cache-dir --dest "$CHATTERPAL_TEST_WHEELHOUSE" --requirement "$RUNNER_TEMP/packaged-cli-requirements.txt"
          uv run --no-project --python 3.12 --with pip python -m pip download --only-binary=:all: --no-cache-dir --dest "$CHATTERPAL_TEST_WHEELHOUSE" hatchling
      - name: Collect every test without external services
        run: uv run --frozen python -m pytest -o addopts='' --collect-only -q
      - name: Run offline regression and measure full-package coverage
        run: uv run --frozen python -m pytest -q --cov-report=xml --junitxml=pytest-results.xml -W error::RuntimeWarning -W error::pytest.PytestUnhandledThreadExceptionWarning
      - name: Upload test and coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: python-test-reports
          path: |
            pytest-results.xml
            coverage.xml
            htmlcov/
          if-no-files-found: ignore

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm test
      - run: npm run build
      - run: npm run lint
      - name: Install Chromium for browser regressions
        run: npx --no-install playwright install --with-deps chromium
      - name: Run offline browser regressions
        shell: bash
        env:
          BROWSER_OUTPUT_DIR: ${{ runner.temp }}/frontend-browser
        run: |
          mkdir -p "$BROWSER_OUTPUT_DIR"
          ./node_modules/.bin/vite --host 127.0.0.1 --port 13204 --strictPort > "$BROWSER_OUTPUT_DIR/vite.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true; wait "$server_pid" 2>/dev/null || true' EXIT
          node --input-type=module <<'NODE'
          import { setTimeout as delay } from 'node:timers/promises';
          const deadline = Date.now() + 30_000;
          let ready = false;
          while (Date.now() < deadline) {
            try {
              const response = await fetch('http://127.0.0.1:13204/', {
                signal: AbortSignal.timeout(1000),
              });
              const html = await response.text();
              if (response.ok && html.includes('/@vite/client')) {
                ready = true;
                break;
              }
            } catch {
              // Vite may not be listening yet.
            }
            await delay(250);
          }
          if (!ready) throw new Error('Vite did not become ready within 30 seconds');
          NODE
          if ! kill -0 "$server_pid" 2>/dev/null; then
            printf '%s\n' 'The Vite process exited before browser checks started' >&2
            exit 1
          fi
          BROWSER_OUTPUT_DIR="$BROWSER_OUTPUT_DIR/legacy" npm run test:browser -- http://127.0.0.1:13204 2>&1 | tee "$BROWSER_OUTPUT_DIR/legacy.log"
          BROWSER_OUTPUT_DIR="$BROWSER_OUTPUT_DIR/learning" npm run test:learning:browser -- http://127.0.0.1:13204 2>&1 | tee "$BROWSER_OUTPUT_DIR/learning.log"
      - name: Upload browser diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-browser-diagnostics
          path: ${{ runner.temp }}/frontend-browser/
          if-no-files-found: ignore
          retention-days: 7
