[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "chatterpal"
version = "0.1.0"
description = "AI-powered English pronunciation practice system"
readme = "README.md"
license = {file = "LICENSE"}
authors = [
    {name = "ChatterPal Team"}
]
requires-python = ">=3.12"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Education",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Education",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
]
# Keep configuration and CLI help usable without an audio/model/UI runtime.
# Versions match the accepted lock; selecting extras does not upgrade providers.
dependencies = [
    "pydantic==2.11.7",
    "pydantic-settings==2.10.1",
    "python-dotenv==1.1.1",
    "pyyaml==6.0.2",
    "typing-extensions==4.14.1",
]

[project.optional-dependencies]
api = [
    "fastapi==0.116.1",
    "uvicorn==0.35.0",
    "python-multipart==0.0.20",
    "aiofiles==24.1.0",
    "uvloop==0.21.0; sys_platform != 'win32'",
]
audio = [
    "numpy==2.2.6",
    "soundfile==0.13.1",
    "scipy==1.16.1",
]
aliyun-asr = [
    "chatterpal[audio]==0.1.0",
    # The official NLS SDK provides nls; it also declares matplotlib/OSS deps.
    "alibabacloud-nls-python-sdk==1.0.2",
]
cloud = [
    "chatterpal[audio,aliyun-asr]==0.1.0",
    "requests==2.32.4",
    "openai==1.99.9",
    "dashscope==1.24.1",
    "edge-tts==7.3.1",
    "websockets==15.0.1",
    "cachetools==6.1.0",
    "asyncio-throttle==1.0.2",
    "dataclasses-json==0.6.7",
]
local-whisper = [
    "chatterpal[audio]==0.1.0",
    "openai-whisper==20250625",
    "speechrecognition==3.14.3",
    "numba==0.61.2",
]
assessment = [
    "chatterpal[audio]==0.1.0",
    "myprosody==20",
    "librosa==0.11.0",
    "scikit-learn==1.7.1",
    "praat-parselmouth==0.4.6",
    "matplotlib==3.10.5",
    "seaborn==0.13.2",
]
gradio = [
    "chatterpal[api,cloud,local-whisper,assessment]==0.1.0",
    "gradio==5.42.0",
]
microphone = [
    "chatterpal[local-whisper]==0.1.0",
    "pyaudio==0.2.14",
]
full = [
    "chatterpal[api,cloud,local-whisper,assessment,gradio,microphone]==0.1.0",
]
dev = [
    "chatterpal[full]==0.1.0",
    "pytest>=8.4.1",
    "pytest-cov>=6.2.1",
    "pytest-asyncio>=1.1.0",
    "black>=25.1.0",
    "isort>=6.0.1",
    "flake8>=7.3.0",
    "mypy>=1.0.0",
    "pre-commit>=3.0.0",
]

[project.scripts]
chatterpal = "chatterpal.cli.run:main"
chatterpal-setup = "chatterpal.cli.setup:main"
chatterpal-run = "chatterpal.cli.run:main"

[project.urls]
Homepage = "https://github.com/likebeans/ChatterPal"
Repository = "https://github.com/likebeans/ChatterPal"
Issues = "https://github.com/likebeans/ChatterPal/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/chatterpal"]

[tool.black]
line-length = 88
target-version = ['py312']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
)/
'''

[tool.isort]
profile = "black"
multi_line_output = 3
line_length = 88
known_first_party = ["chatterpal"]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true

[[tool.mypy.overrides]]
module = [
    "myprosody.*",
    "parselmouth.*",
    "speech_recognition.*",
    "dashscope.*",
    "edge_tts.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "--strict-config",
    "--strict-markers",
    "-ra",
    "--cov=src/chatterpal",
    "--cov-report=term-missing",
    "--cov-report=html",
    "--cov-fail-under=80",
]
asyncio_mode = "strict"
asyncio_default_fixture_loop_scope = "function"

[tool.coverage.run]
source = ["src/chatterpal"]
omit = [
    "*/tests/*",
    "*/test_*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug:",
    "if settings.DEBUG",
    "raise AssertionError",
    "raise NotImplementedError",
    "if 0:",
    "if __name__ == .__main__.:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]

[dependency-groups]
# `uv sync` and pip install 'chatterpal[dev]' share one development definition.
dev = ["chatterpal[dev]==0.1.0"]
